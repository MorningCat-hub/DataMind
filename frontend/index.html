<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DataMind</title>

    <link
        rel="stylesheet"
        href="/frontend/style.css?v=4.15"
    >
</head>

<body>

    <div class="app">

        <!-- ==============================
             V4.15 历史对话

             记录存在服务端（一个会话一个 JSON 文件），
             这里只负责列出、打开、删除、导出。
        ============================== -->

        <aside
            id="sidebar"
            class="sidebar"
        >

            <div class="sidebar-head">
                <span>历史对话</span>
            </div>

            <div
                id="conversationList"
                class="sidebar-list"
            >
            </div>

        </aside>

        <!-- ==============================
             顶栏
        ============================== -->

        <header class="topbar">

            <div class="brand">
                DataMind<span>Self-Healing Data Analysis Agent</span>
            </div>

            <div class="topbar-actions">

                <span
                    id="datasetBadge"
                    class="badge hidden"
                >
                </span>

                <button
                    id="sidebarToggle"
                    class="ghost-button sidebar-toggle"
                    type="button"
                    title="历史对话"
                >
                    历史
                </button>

                <button
                    id="newChatButton"
                    class="ghost-button"
                    type="button"
                >
                    新建对话
                </button>

            </div>

        </header>


        <!-- ==============================
             对话区
        ============================== -->

        <main
            id="chatSection"
            class="chat"
        >

            <div
                id="emptyState"
                class="empty-state"
            >

                <h2>开始一次数据分析</h2>

                <p>
                    在下方添加数据文件，然后用中文说出你想分析什么
                </p>

                <p class="empty-hint">
                    支持 CSV / Excel / Word / 图片
                </p>

            </div>

            <div
                id="messageList"
                class="message-list"
            >
            </div>

        </main>


        <!-- ==============================
             输入区
        ============================== -->

        <footer class="composer-wrap">

            <div class="composer">

                <div
                    id="attachmentBar"
                    class="attachment-bar hidden"
                >
                </div>

                <div class="composer-input-row">

                    <textarea
                        id="question"
                        rows="1"
                        placeholder="给 DataMind 发送分析需求"
                    ></textarea>

                    <button
                        id="attachButton"
                        class="icon-button"
                        type="button"
                        title="添加数据文件"
                    >
                        📎
                    </button>

                    <button
                        id="sendButton"
                        class="send-button"
                        type="button"
                        title="发送"
                    >
                        ↑
                    </button>

                </div>

            </div>

            <p
                id="composerHint"
                class="composer-hint"
            >
                支持 CSV / Excel / Word / 图片；第一轮请先添加附件
            </p>

            <input
                id="file"
                class="hidden-input"
                type="file"
                accept=".csv,.txt,.tsv,.xlsx,.xlsm,.xls,.docx,.png,.jpg,.jpeg,.bmp,.webp,.gif"
            >

        </footer>

    </div>


    <!-- ==============================
         错误信息
    ============================== -->

    <section
        id="errorSection"
        class="error-card hidden"
    >

        <h2>执行错误</h2>

        <pre id="errorContainer"></pre>

    </section>


    <!-- Markdown Renderer -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- 前端主逻辑 -->
    <script src="/frontend/app.js?v=4.15"></script>

</body>

</html>
